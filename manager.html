<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4a2c17"><title>Business Manager | Annapurna Foods"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/manager.css"></head><body><header class="site-header"><h1 class="brand">Annapurna Foods</h1><p class="tagline">Internal business manager</p></header><nav class="site-nav"><ul><li><a href="/">Public homepage</a></li><li><a href="#dashboard">Dashboard</a></li><li><a href="#entries">Entries</a></li><li><a href="#catalog">Setup</a></li></ul></nav><main class="manager"><h2>Business dashboard</h2><p id="today"></p><section id="dashboard" class="metrics"></section><p class="notice">Provisional indicator only. Purchases are cash outflow, not cost of goods sold. Actual profit requires product costing.</p><section><h2>Available finished stock</h2><div id="stock"></div></section><section id="entries"><h2>Record activity</h2><div class="forms"><form id="sale"><h3>Sale</h3><label>Date<input name="day" type="date" required></label><label>Product<select name="product_id" required></select></label><label>Quantity kg<input name="kg" type="number" min="0" step="1" value="0"></label><label>Quantity grams<input name="g" type="number" min="0" max="999" step="1" value="0"></label><p>Price per kg is configured under Setup.</p><p id="sale-total">Total: —</p><button>Save sale</button></form><form id="purchase"><h3>Purchase</h3><label>Date<input name="day" type="date" required></label><label>Material<select name="material_id" required></select></label><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Unit<select name="unit"><option>kg</option><option>g</option><option>piece</option><option>bag</option></select></label><label>Amount ₹<input name="amount" type="number" min="0" step="0.01" required></label><button>Save purchase</button></form><form id="expense"><h3>Expense</h3><label>Date<input name="day" type="date" required></label><label>Category<input name="category" required></label><label>Description<input name="description" required></label><label>Amount ₹<input name="amount" type="number" min="0" step="0.01" required></label><button>Save expense</button></form><form id="production"><h3>Finished production</h3><label>Date<input name="day" type="date" required></label><label>Product<select name="product_id" required></select></label><label>Quantity kg<input name="kg" type="number" min="0" step="1" value="0"></label><label>Quantity grams<input name="g" type="number" min="0" max="999" step="1" value="0"></label><p>Raw materials are not automatically deducted.</p><button>Save production</button></form></div></section><section id="catalog"><h2>Configure items and opening stock</h2><div class="forms"><form id="new-product"><h3>Product and price</h3><label>Name<input name="name" required></label><label>Selling price per kg ₹<input name="price_per_kg" type="number" min="0" step="0.01" required></label><button>Add product</button></form><form id="new-material"><h3>Raw material</h3><label>Name<input name="name" required></label><button>Add material</button></form><form id="opening"><h3>Opening stock</h3><label>Stock type<select name="kind"><option value="finished">Finished product</option><option value="raw">Raw material</option></select></label><label>Item<select name="item_id" required></select></label><label>Quantity kg<input name="kg" type="number" min="0" step="1" value="0"></label><label>Quantity grams<input name="g" type="number" min="0" max="999" step="1" value="0"></label><button>Save opening stock</button></form></div></section><p id="message" role="status"></p></main><script src="/static/manager.js"></script></body></html>
